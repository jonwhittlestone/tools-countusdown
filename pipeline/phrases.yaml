# What the voices say. {minutes} is the number, {unit} is "minute" or "minutes".
# Tiers follow the design doc (Q10): gentle > 10 min, nudge 6-10, firm <= 5.
# Firmness comes from wording only; every clip is loudness-normalised to the same level.

# Minute values each tier is ever asked to say. Durations a preset may use are
# 5, 10, 15, 20, 25, 30, 45 and 60; marks below them are 30, 25, 20, 15, 10, 5..1.
minutes:
  gentle: [60, 45, 30, 25, 20, 15]
  nudge: [10]
  firm: [5, 4, 3, 2, 1]

tiers:
  gentle:
    - "Everyone, we leave in {minutes} {unit}."
    - "{minutes} {unit} until we go. Nice and steady."
    - "Just so you know, we're leaving in {minutes} {unit}."
  nudge:
    - "{minutes} {unit}. Soon time to go, so we get there on time."
    - "{minutes} {unit} left. Time to start getting ready."
    - "In {minutes} {unit} we head out. Shoes and coats soon, please."
  firm:
    - "In {minutes} {unit} we must leave, or we will be late."
    - "{minutes} {unit}. Shoes on, coats on, everyone."
    - "Only {minutes} {unit} left. Let's get to the door."

target:
  - "It's time to leave now. Shoes on, coats on, out we go."
  - "Time to go, everyone. Let's head out the door."
  - "That's the time. Let's leave now, please."

late:
  - "We are now late. Please go straight to the door."
  - "We're running late now. Out the door, everyone."
  - "It's past time. Let's leave right now, please."
