[project]
name = "countusdown-pipeline"
version = "0.1.0"
description = "Offline audio pipeline for COUNT-US-DOWN: TTS voice cues and synthesised ambient stems"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
